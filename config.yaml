# All tunable choices live here. Dates are inclusive.
data:
  target_ticker: TSLA
  market_tickers: [SPY, QQQ, "^VIX"]
  start: "2010-06-29"        # TSLA IPO date
  end: "2025-12-31"
  auto_adjust: true          # split-adjusted (TSLA pays no dividends)
  cache_path: data/raw/prices.csv

quality:
  # A single-day simple return beyond this is flagged for manual review (possible unadjusted split).
  extreme_return_abs: 0.40
  # Returns within this distance of a split ratio's mechanical return (-80% for 1:5, -66.7% for 1:3) are flagged.
  split_ratio_tolerance: 0.03
  known_splits:              # date: shares-out multiplier
    "2020-08-31": 5
    "2022-08-25": 3

features:
  return_lags: 20            # TSLA log returns r_t ... r_{t-19}
  rv_windows: [5, 20]        # realized-vol windows (days)
  volume_window: 20
  market_return_lags: 5      # SPY / QQQ log returns r_t ... r_{t-4}

split:
  train_frac: 0.70
  val_frac: 0.10             # test = remaining 0.20

ridge:
  alpha_grid: [0.01, 0.0316, 0.1, 0.316, 1, 3.16, 10, 31.6, 100, 316, 1000, 3160, 10000]

fnn:
  hidden_grid: [[32, 16], [64, 32]]
  dropout_grid: [0.1, 0.3]
  weight_decay_grid: [0.0001, 0.001]
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 300
  patience: 20               # early stopping on validation MSE
  seeds: [0, 1, 2, 3, 4]

lstm:
  window_grid: [20, 60]
  hidden_grid: [16, 32]
  dropout_grid: [0.1, 0.3]
  weight_decay: 0.0001
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 200
  patience: 20
  seeds: [0, 1, 2, 3, 4]

# Phase 3 replication of the old iRisk notebook design, run on the clean pipeline:
# price-level target, 60-day window of closes, 4 stacked LSTM(50) + Dropout(0.2), MinMax scaling.
legacy:
  window: 60
  units: 50
  layers: 4
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 32
  max_epochs: 300
  patience: 20
  seeds: [0, 1, 2]
